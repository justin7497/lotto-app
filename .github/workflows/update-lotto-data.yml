# 회차 데이터·추첨 후 알림은 Firebase Functions(Scheduler)가 담당합니다.
# 토요 Hosting 풀배포는 하지 않습니다 — 앱은 Firestore/API에서 최신 회차를 읽습니다.
#
# 수동으로 번들 JSON 갱신·Hosting 배포가 필요할 때만 실행:
#   Actions > Update Lotto Data & Deploy > Run workflow
#   force_deploy=true 이면 새 회차 없어도 빌드·배포
#   run_notifications=true 는 비상 시에만 (Functions와 이중 발송 주의)
#
# Secrets: FIREBASE_TOKEN, LOTTO_APP_ENV, FIREBASE_SERVICE_ACCOUNT_JSON, RESEND_*

name: Update Lotto Data & Deploy

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "새 회차 없어도 빌드·배포"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      update_bundle_json:
        description: "lottoData.json 번들 갱신 후 커밋"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_notifications:
        description: "알림 수동 발송 (기본 off — Functions가 담당)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: update-lotto-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Firebase env
        env:
          LOTTO_APP_ENV: ${{ secrets.LOTTO_APP_ENV }}
        run: |
          if [ -z "$LOTTO_APP_ENV" ]; then
            echo "::warning::LOTTO_APP_ENV secret is not set. Build may fail if Firebase env is required."
          else
            printf '%s\n' "$LOTTO_APP_ENV" > artifacts/lotto-app/.env.local
          fi

      - name: Update lotto data
        id: update
        if: github.event.inputs.update_bundle_json == 'true'
        run: |
          node scripts/update-lotto-data.mjs | tee /tmp/update-lotto.log
          LATEST=$(node -e "const r=require('./artifacts/lotto-app/src/data/lottoData.json'); console.log(Math.max(...r.map(x=>x.drwNo)))")
          echo "latest_drw_no=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest round in lottoData.json: ${LATEST}회"

      - name: Check data changes
        id: changes
        if: github.event.inputs.update_bundle_json == 'true'
        run: |
          if git diff --quiet -- artifacts/lotto-app/src/data/lottoData.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new lotto rounds in JSON."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- artifacts/lotto-app/src/data/lottoData.json
          fi

      - name: Commit updated data
        if: github.event.inputs.update_bundle_json == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/lotto-app/src/data/lottoData.json
          git commit -m "chore: update lotto data to latest draw"
          git push

      - name: Notify winners
        if: github.event.inputs.run_notifications == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: node scripts/notify-winners.mjs

      - name: Notify device wins (issued slip)
        if: github.event.inputs.run_notifications == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/notify-device-wins.mjs

      - name: Notify engagement (post-draw)
        if: github.event.inputs.run_notifications == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/notify-engagement.mjs --campaign=sat-post-draw

      - name: Refresh Firestore lotto detail cache
        if: github.event.inputs.update_bundle_json == 'true' && steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/refresh-lotto-detail-sync.mjs

      - name: Install functions dependencies
        if: >-
          (github.event.inputs.update_bundle_json == 'true' && steps.changes.outputs.changed == 'true') ||
          github.event.inputs.force_deploy == 'true'
        run: npm ci --prefix functions

      - name: Typecheck lotto app
        if: >-
          (github.event.inputs.update_bundle_json == 'true' && steps.changes.outputs.changed == 'true') ||
          github.event.inputs.force_deploy == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: corepack pnpm --filter @workspace/lotto-app run typecheck

      - name: Build and deploy
        if: >-
          (github.event.inputs.update_bundle_json == 'true' && steps.changes.outputs.changed == 'true') ||
          github.event.inputs.force_deploy == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PORT: "5173"
          BASE_PATH: "/"
          LATEST_DRW_NO: ${{ steps.update.outputs.latest_drw_no }}
          APP_VERSION_PROMPT: "0"
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Run 'firebase login:ci' locally and add the token."
            exit 1
          fi

          corepack pnpm run build:lotto
          node scripts/verify-lotto-sync.mjs

          DEPLOY_ONLY="hosting:lotto,functions"
          if [ -f firestore.rules ]; then
            DEPLOY_ONLY="hosting:lotto,functions,firestore:rules"
          fi

          echo "Deploying round ${LATEST_DRW_NO:-?}회: $DEPLOY_ONLY"
          npx firebase-tools@14.12.0 deploy --only "$DEPLOY_ONLY" --project lotto-app-ljh --non-interactive

      - name: Skip deploy
        if: >-
          !(github.event.inputs.update_bundle_json == 'true' && steps.changes.outputs.changed == 'true') &&
          github.event.inputs.force_deploy != 'true'
        run: echo "No deploy requested. Weekly draw sync runs on Firebase Functions Scheduler."
