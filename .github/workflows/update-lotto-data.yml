# 매주 토요일 추첨(약 20:45 KST) 후 자동으로 당첨번호를 갱신하고 Firebase에 배포합니다.
#
# 필요한 GitHub Secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_TOKEN      - firebase login:ci 로 발급
#   LOTTO_APP_ENV       - artifacts/lotto-app/.env.local 전체 내용 (VITE_FIREBASE_* 포함)
#   FIREBASE_SERVICE_ACCOUNT_JSON - 당첨 알림용 Firebase Admin 서비스 계정 JSON
#   RESEND_API_KEY      - 당첨 알림 이메일 발송 (Resend)
#   RESEND_FROM_EMAIL   - 발신 이메일 주소 (선택)
#
# 수동 실행: Actions 탭 > Update Lotto Data & Deploy > Run workflow

name: Update Lotto Data & Deploy

on:
  schedule:
    # 토요 20:50 KST = 11:50 UTC
    - cron: "50 11 * * 6"
    # 토요 21:00 KST = 12:00 UTC
    - cron: "0 12 * * 6"
    # 토요 21:15 KST = 12:15 UTC (API 지연 대비)
    - cron: "15 12 * * 6"
    # 토요 22:00 KST = 13:00 UTC (Actions 지연·API 지연 대비)
    - cron: "0 13 * * 6"
    # 일요 09:00 KST 재시도 = 00:00 UTC
    - cron: "0 0 * * 0"
    # 일요 21:00 KST 재시도 = 12:00 UTC
    - cron: "0 12 * * 0"
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/update-lotto-data.yml"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "새 회차 없어도 빌드·배포"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: update-lotto-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Firebase env
        env:
          LOTTO_APP_ENV: ${{ secrets.LOTTO_APP_ENV }}
        run: |
          if [ -z "$LOTTO_APP_ENV" ]; then
            echo "::warning::LOTTO_APP_ENV secret is not set. Build may fail if Firebase env is required."
          else
            printf '%s\n' "$LOTTO_APP_ENV" > artifacts/lotto-app/.env.local
          fi

      - name: Update lotto data
        id: update
        run: |
          node scripts/update-lotto-data.mjs | tee /tmp/update-lotto.log
          LATEST=$(node -e "const r=require('./artifacts/lotto-app/src/data/lottoData.json'); console.log(Math.max(...r.map(x=>x.drwNo)))")
          echo "latest_drw_no=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest round in lottoData.json: ${LATEST}회"

      - name: Check data changes
        id: changes
        run: |
          if git diff --quiet -- artifacts/lotto-app/src/data/lottoData.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new lotto rounds in JSON."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- artifacts/lotto-app/src/data/lottoData.json
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/lotto-app/src/data/lottoData.json
          git commit -m "chore: update lotto data to latest draw"
          git push

      - name: Notify winners
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: node scripts/notify-winners.mjs

      - name: Notify device wins (issued slip)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/notify-device-wins.mjs

      - name: Notify engagement (post-draw)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/notify-engagement.mjs --campaign=sat-post-draw

      - name: Install functions dependencies
        if: >-
          steps.changes.outputs.changed == 'true' ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true'
        run: npm ci --prefix functions

      - name: Typecheck lotto app
        if: >-
          steps.changes.outputs.changed == 'true' ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: corepack pnpm --filter @workspace/lotto-app run typecheck

      - name: Build and deploy
        if: >-
          steps.changes.outputs.changed == 'true' ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PORT: "5173"
          BASE_PATH: "/"
          LATEST_DRW_NO: ${{ steps.update.outputs.latest_drw_no }}
          APP_VERSION_PROMPT: "0"
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Run 'firebase login:ci' locally and add the token."
            exit 1
          fi

          corepack pnpm run build:lotto
          node scripts/verify-lotto-sync.mjs

          DEPLOY_ONLY="hosting:lotto,functions"
          if [ -f firestore.rules ]; then
            DEPLOY_ONLY="hosting:lotto,functions,firestore:rules"
          fi

          echo "Deploying round ${LATEST_DRW_NO:-?}회: $DEPLOY_ONLY"
          npx firebase-tools@14.12.0 deploy --only "$DEPLOY_ONLY" --project lotto-app-ljh --non-interactive

      - name: Skip deploy (already up to date)
        if: >-
          steps.changes.outputs.changed != 'true' &&
          !(github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true')
        run: echo "Already up to date. Deploy skipped."
