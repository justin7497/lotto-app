# 참여 유도 푸시 — 수동 백업 전용
#
# 본선 발송은 Cloud Scheduler (Functions):
#   scheduledEngagementMorning  매일 10:00 KST  daily-morning + due(welcome/inactive)
#   scheduledEngagementEvening  매일 20:00 KST  daily-evening
#   scheduledEngagementSatPre   토요 18:00 KST  sat-pre-draw
#
# 필요한 GitHub Secrets:
#   FIREBASE_SERVICE_ACCOUNT_JSON
#
# 수동 실행: Actions > Engagement Push Notifications > Run workflow

name: Engagement Push Notifications

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "특정 캠페인 id (예: daily-morning, daily-evening, sat-pre-draw). 비우면 due 캠페인만"
        required: false
        type: string
      dry_run:
        description: "dry-run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: notify-engagement
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Send engagement push
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.campaign }}" ]; then
            node scripts/notify-engagement.mjs --campaign="${{ github.event.inputs.campaign }}" $DRY
          else
            node scripts/notify-engagement.mjs $DRY
          fi
